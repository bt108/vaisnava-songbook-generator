title: Maṅgala-ārati
intro: |
  \chapterquote{Enthusiastic mood is maintained when everyone is always without fail chanting sixteen rounds daily, rising early for maṅgala-āratī, reading books, preaching—in this way, by observing strictly the regulative principles of devotional life, that enthusiasm or great eagerness to have Kṛṣṇa will come out.}{(Letter to Trai, December 27, 1972, Bombay)}

  \chapterquote{One who, with great care and adoration, loudly recites this beautiful prayer to the spiritual master during the brahma-muhūrta obtains direct service to Kṛṣṇa, the Lord of Vṛndāvana, at the time of his death.}{(Viśvanātha Cakravartī Ṭhākura, Śrī Gurv-aṣṭakam, verse 9)}
content:
  - include: gurvastakam
