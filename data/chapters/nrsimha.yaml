title: Prayers to Lord Nṛsiṁha-deva
intro: |
  \chapterquote{In the Nṛsiṁha Purāṇa, Lord Nṛsiṁhadeva says, “Anyone who prays unto Me and takes shelter from Me becomes My ward, and I protect him always from all sorts of calamities.”}{(Nectar of Devotion 11, Aspects of Transcendental Service)}

  \chapterquote{When Lord Nṛsiṁhadeva appeared, Prahlāda Mahārāja was never afraid of Him, whereas his atheist father was immediately faced with death personified and was killed. Therefore, although Lord Nṛsiṁhadeva appears as death for an atheist like Hiraṇyakaśipu, He is always kind and is the reservoir of all pleasure for the devotees like Prahlāda. A pure devotee is not, therefore, afraid of birth, death, old age and disease.}{(Kṛṣṇa Book Chapter 87: Prayers by the Personified Vedas)}
content:
  - include: nrsimha-pranama
