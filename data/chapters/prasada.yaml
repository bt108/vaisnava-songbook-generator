title: Prayers to Prasāda
intro: |
  \chapterquote{There is this specific statement in the Padma Purāṇa: ``A person who honors the prasāda and regularly eats it, not exactly in front of the Deity, along with caraṇāmṛta [the water offered to the lotus feet of the Lord, which is mixed with seeds of the tulasī tree], immediately can achieve the results of the pious activities that are obtained through ten thousand performances of sacrificial rites.''}{(Nectar of Devotion, Chapter 9: Partaking of Prasāda)}
content:
  - include: maha-prasade-govinde
  - include: prasada-sevaya
