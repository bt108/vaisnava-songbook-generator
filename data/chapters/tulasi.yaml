title: Prayers to Tulasī-devī
intro: |
  \chapterquote{\textbf{Devotee:} How is it possible that Tulasī-devī is a pure devotee, what we might call a plant?

  \textbf{Śrīla Prabhupāda:} That you cannot know in your impure state. You just become pure. You will understand. \textit{(laughter)} Just like a physician, he can understand another physician, what is his position. The layman, what he can understand? If you say, physician, ``Oh, how I can understand this physician?'' How you can understand? You are not a physician. You become a physician, then you will understand what kind of physician he is. So when you become devotee, you will understand what kind of devotee is Tulasī. So long you are not devotee, you cannot understand. Don't expect. Therefore we have to accept the authority. That is beginning. Śāstra says, ``Tulasī is the greatest devotee of Kṛṣṇa.'' We have to accept, that's all. Authority. How she is so great devotee, that you will understand when you become a devotee. You come to the platform; then you will understand, not before. Now chant.}{(SB Class, Auckland NZ, February 22, 1973)}

  \chapterquote{Tulasī Devī never goes back to Godhead, she is always with Godhead. She is a pure devotee and thus she has appeared on this planet to render service to Kṛṣṇa by being offered in all temples throughout the world by being offered up to the lotus feet of Kṛṣṇa. Tulasī plants are liberated souls who want to serve Kṛṣṇa in that way.}{(Letter to Ekayani, August 31, 1971)}
