title: Auspicious Invocations
intro: |-
  \chapterquote{In the beginning of this narration, simply by remembering the spiritual master, the devotees of the Lord, and the Personality of Godhead, I have invoked their benedictions.}{(Śrī Caitanya-caritāmṛta, Ādi-līlā 1.20)}

  \chapterquote{Such remembrance destroys all difficulties and very easily enables one to fulfill his own desires.}{(Śrī Caitanya-caritāmṛta, Ādi-līlā 1.21)}

  \chapterquote{The invocation involves three processes: defining the objective, offering benedictions and offering obeisances.}{(Śrī Caitanya-caritāmṛta, Ādi-līlā 1.22)}
content:
  - include: pranama-guru
  - include: pranama-prabhupada
  - include: mahamantra-panca-tattva
  - include: pranama-rupa
  - include: mangalacarana
  - include: pranama-gauranga
  - include: pranama-krsna
  - include: pranama-radha
  - include: pranama-vaishnava
