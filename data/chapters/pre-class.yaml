title: Prayers before Class
intro: |-
  Śrīla Prabhupāda was very fond of ``Jaya Rādhā-Mādhava'' and sang it just before his lectures. In Allahabad and Gorakhpur, Śrīla Prabhupāda fell into a trance after singing the first two lines, and after some time he came back into external consciousness and said, ``Now just chant Hare Kṛṣṇa.'' Śrīla Prabhupāda said that this song is ``a picture of Vṛndāvana. Everything is there---Śrīmatī Rādhārāṇī, Vṛndāvana, Govardhana, Yaśodā, and all the cowherd boys.''
content:
  - include: jaya-radha-madhava
