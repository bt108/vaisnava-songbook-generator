title: Greeting the Deities
intro: |
  \chapterquote{In the Varāha Purāṇa there is a statement praising the seeing of the Deity of Śrī Kṛṣṇa in the temple. A devotee says there, ``My dear Vāsundharā, any person who goes to Vṛndāvana and sees the Deity of Govinda-deva is free from the courthouse of Yamarāja and is allowed to enter into the highest planetary system, in which reside the demigods.'' This means that even an ordinary person who goes to Vṛndāvana out of inquisitiveness and by chance sees the temple, especially that of Govinda-deva, even if he is not elevated to the spiritual kingdom, is still assured promotion to the higher planetary systems. This means that simply by visiting the Deity of Govinda in Vṛndāvana one becomes highly elevated in pious life.}{(Nectar of Devotion, Chapter 9: Seeing the Deity)}
