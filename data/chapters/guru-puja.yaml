title: Guru pūjā
intro: |
  \chapterquote{So you have got this opportunity, \sa{Kṛṣṇa} consciousness. Everything is explained in the \sa{Bhagavad-gītā}, what is what. Do not lose this opportunity. Do not be foolish, misled by so-called scientists or philosophers or politicians. Take to \sa{Kṛṣṇa} consciousness. And that is possible only \sa{guru-kṛṣṇa-kṛpāya} [Cc. Madhya 19.151]. By the mercy of \sa{guru} and by the mercy of \sa{Kṛṣṇa} you can achieve all success. This is the secret.

  \par\vspace{2ex}%
  \sa{yasya deve parā bhaktir\\
  yathā deve tathā gurau\\
  tasyaite kathitā hy arthāḥ\\
  prakāśante mahātmanaḥ} [ŚU 6.23]
  \par\vspace{2ex}%
  So this \sa{guru-pūjā} which we are doing, it is not self aggrandizement; it is real teaching. You sing daily, what is that? \sa{Guru-mukha-padma-vākya} \sa{āra nā kariyā aikya}. Bas, this is translation. I tell you frankly, whatever little success is there in this \sa{Kṛṣṇa} consciousness movement, I simply believed what was spoken by my \sa{Guru Mahārāja}. You also continue that. Then every success will come.}{(Arrival Address, New York, July 9, 1976)}
