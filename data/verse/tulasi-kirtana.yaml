title: Tulasī Kīrtana
author: unknown
language: bn
slokas:
  - number: 1
    padas:
      - entries:
          - {word: namo, gloss: I bow}
          - {word: namaḥ, gloss: I bow}
          - {word: tulasī, gloss: Tulasī}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: preyasī, gloss: beloved}
          - {word: namo, gloss: I bow}
          - {word: namaḥ, gloss: I bow}
      - entries:
          - {word: rādhā-, gloss: Rādhā-}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: sevā, gloss: service}
          - {word: pāba, gloss: will get}
          - {word: ei, gloss: this}
          - {word: abilāṣī, gloss: desirous}
    translation: |-
      O Tulasī, beloved of Kṛṣṇa, I bow before you again and again. My desire is to obtain the service of Śrī Śrī Rādhā and Kṛṣṇa.
    footnotes: []
  - number: 2
    padas:
      - entries:
          - {word: ye, gloss: who}
          - {word: tomāra, gloss: your}
          - {word: śaraṇa, gloss: shelter}
          - {word: 'laya,', gloss: takes}
          - {word: tāra, gloss: his}
          - {word: vāñchā, gloss: desire}
          - {word: pūrṇa, gloss: fulfilled}
          - {word: haya, gloss: becomes}
      - entries:
          - {word: kṛpā, gloss: mercy}
          - {word: kori', gloss: having done}
          - {word: kara, gloss: make}
          - {word: tāre, gloss: him}
          - {word: vṛndāvana-, gloss: Vṛndāvana-}
          - {word: vāsī, gloss: resident}
    translation: |-
      Whoever takes shelter of you has his wishes fulfilled. Bestowing your mercy on him, you make him a resident of Vṛndāvana.
    footnotes: []
  - number: 3
    padas:
      - entries:
          - {word: mora, gloss: my}
          - {word: ei, gloss: this}
          - {word: 'abhilāṣa,', gloss: desire}
          - {word: vilāsa, gloss: pleasure}
          - {word: kuñje, gloss: grove}
          - {word: dio, gloss: give}
          - {word: vāsa, gloss: residence}
      - entries:
          - {word: nayana, gloss: eye}
          - {word: heriba, gloss: will behold}
          - {word: sadā, gloss: always}
          - {word: yugala-, gloss: pair-}
          - {word: rūpa-, gloss: form-}
          - {word: rāśi, gloss: abundance}
    translation: |-
      My desire is that you will also give me a residence in the pleasure groves of Śrī Vṛndāvana-dhāma. Thus within my vision I will always behold the beautiful pastimes of Rādhā and Kṛṣṇa.
    footnotes: []
  - number: 4
    padas:
      - entries:
          - {word: ei, gloss: this}
          - {word: nivedana, gloss: request}
          - {word: 'dhara,', gloss: accept}
          - {word: sakhīra, gloss: of sakhī}
          - {word: anugata, gloss: follower}
          - {word: kara, gloss: make}
      - entries:
          - {word: sevā-, gloss: service-}
          - {word: adhikāra, gloss: right}
          - {word: diye, gloss: giving}
          - {word: kara, gloss: make}
          - {word: nija, gloss: own}
          - {word: dāsī, gloss: maidservant}
    translation: |-
      I beg you to make me a follower of the cowherd damsels of Vraja. Please give me the privilege of devotional service and make me your own maidservant.
    footnotes: []
  - number: 5
    padas:
      - entries:
          - {word: dīna, gloss: humble}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: dāse, gloss: servant}
          - {word: 'kaya,', gloss: says}
          - {word: ei, gloss: this}
          - {word: yena, gloss: so that}
          - {word: mora, gloss: my}
          - {word: haya, gloss: becomes}
      - entries:
          - {word: śrī-, gloss: Śrī-}
          - {word: rādhā-, gloss: Rādhā-}
          - {word: govinda-, gloss: Govinda-}
          - {word: preme, gloss: love}
          - {word: sadā, gloss: always}
          - {word: yena, gloss: so that}
          - {word: bhāsi, gloss: float}
    translation: |-
      This very fallen and lowly servant of Kṛṣṇa prays, "May I always swim in the love of Śrī Śrī Rādhā and Govinda."
    footnotes: []
