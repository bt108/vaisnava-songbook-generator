          - {word: ḍāko, gloss: call}
          - {word: caitanya-, gloss: Caitanya-}
          - {word: nitāi, gloss: Nitāi}
    translation: |-
      But You, dear Kṛṣṇa, are very kind to us and have given us such nice prasādam just to control the tongue. Now we take this prasādam to our full satisfaction and glorify You—Śrī Śrī Rādhā and Kṛṣṇa—and in love call for the help of Lord Caitanya and Nityānanda.
    footnotes: []
