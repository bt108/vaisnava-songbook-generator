          - {word: jetā, gloss: conquer}
          - {word: kaṭhina, gloss: difficult}
          - {word: saṁsāre, gloss: world}
    translation: |-
      O Lord, this material body is a place of ignorance, and the senses are a network of paths leading to death. Somehow we have fallen into this ocean of material sense enjoyment, and of all the senses the tongue is the most voracious and uncontrollable. It is very difficult to conquer the tongue in this world.
