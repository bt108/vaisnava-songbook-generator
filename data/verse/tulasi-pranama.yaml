title: Tulasī Praṇāma
author: unknown
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: vṛndāyai, gloss: Vṛndā}
          - {word: tulasī-, gloss: Tulasī-}
          - {word: devyai, gloss: devī}
          - {word: priyāyai, gloss: beloved}
          - {word: keśavasya, gloss: of Keśava}
          - {word: ca, gloss: and}
      - entries:
          - {word: "viṣṇu-", gloss: "Viṣṇu-"}
          - {word: bhakti-, gloss: bhakti-}
          - {word: prade, gloss: bestower}
          - {word: devi, gloss: goddess}
          - {word: satyavatyai, gloss: Satyavatī}
    translation: |-
      I offer my repeated obeisances unto Vṛndā, Śrīmatī Tulasī-devī, who is very dear to Lord Keśava. O goddess, you bestow devotional service to Kṛṣṇa and you possess the highest truth.
