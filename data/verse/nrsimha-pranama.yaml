title: Śrī Nṛsiṁha Praṇāma
author: Nṛsiṁha Purāṇa
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: namas, gloss: I bow}
          - {word: te, gloss: You}
          - {word: narasiṁhāya, gloss: man-lion}
          - {word: prahlādāhlāda-, gloss: Prahlāda-joy-}
          - {word: dāyine, gloss: giver}
      - entries:
          - {word: hiraṇyakaśipor, gloss: Hiraṇyakaśipu}
          - {word: vakṣaḥ-, gloss: chest-}
          - {word: śilā-, gloss: stone-}
          - {word: ṭaṅka-, gloss: chisel-}
          - {word: nakhālaye, gloss: nail-abode}
    translation: |-
      I offer my obeisances to Lord Narasiṁha who gives joy to Prahlāda Mahārāja and whose nails are like chisels on the stonelike chest of the demon Hiraṇyakaśipu.
    footnotes: []
  - number: 2
    padas:
      - entries:
          - {word: ito, gloss: here}
          - {word: nṛsiṁhaḥ, gloss: Nṛsiṁha}
          - {word: parato, gloss: beyond}
          - {word: nṛsiṁho, gloss: Nṛsiṁha}
          - {break: true}
          - {word: yato, gloss: where}
          - {word: yato, gloss: where}
          - {word: yāmi, gloss: I go}
          - {word: tato, gloss: there}
          - {word: nṛsiṁhaḥ, gloss: Nṛsiṁha}
      - entries:
          - {word: bahir, gloss: outside}
          - {word: nṛsiṁho, gloss: Nṛsiṁha}
          - {word: hṛdaye, gloss: heart}
          - {word: nṛsiṁho, gloss: Nṛsiṁha}
          - {break: true}
          - {word: nṛsiṁham, gloss: Nṛsiṁha}
          - {word: ādiṁ, gloss: origin}
          - {word: śaraṇaṁ, gloss: refuge}
          - {word: prapadye, gloss: I surrender}
    translation: |-
      Lord Nṛsiṁha is here and also there. Wherever I go Lord Nṛsiṁha is there. He is in the heart and is outside as well. I surrender to Lord Nṛsiṁha, the origin of all things and the supreme refuge.
    footnotes: []
  - number: 3
    padas:
      - entries:
          - {word: tava, gloss: Your}
          - {word: kara-, gloss: hand-}
          - {word: kamala-, gloss: lotus-}
          - {word: vare, gloss: excellent}
          - {word: nakham, gloss: nail}
          - {word: adbhuta-, gloss: wonderful-}
          - {word: śṛṅgaṁ, gloss: point}
      - entries:
          - {word: dalita-, gloss: torn-}
          - {word: hiraṇyakaśipu-, gloss: Hiraṇyakaśipu-}
          - {word: tanu-, gloss: body-}
          - {word: bhṛṅgam, gloss: wasp}
      - entries:
          - {word: keśava, gloss: Keśava}
          - {word: dhṛta-, gloss: bearing-}
          - {word: narahari-, gloss: man-lion-}
          - {word: rūpa, gloss: form}
          - {word: jaya, gloss: glory}
          - {word: jagadīśa, gloss: world-lord}
          - {word: hare, gloss: Hari}
    translation: |-
      O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of half-man, half-lion! All glories to You! Just as one can easily crush a wasp between one's fingernails, so in the same way the body of the wasplike demon Hiraṇyakaśipu has been ripped apart by the wonderful pointed nails on Your beautiful lotus hands.
    footnotes: []
