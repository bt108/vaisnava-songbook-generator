          - {word: vṛtti-, gloss: function-}
          - {word: manti, gloss: possessing}
      - entries:
          - {word: paśyanti, gloss: see}
          - {word: pānti, gloss: maintain}
          - {word: kalayanti, gloss: manifest}
          - {word: ciraṁ, gloss: eternally}
          - {word: jaganti, gloss: universes}
      - entries:
          - {word: ānanda-, gloss: bliss-}
          - {word: cinmaya-, gloss: truth-full-}
          - {word: sad-, gloss: substantiality-}
          - {word: ujjvala-, gloss: dazzling-}
          - {word: vigrahasya, gloss: form}
      - entries:
          - {word: govindam, gloss: Govinda}
          - {word: ādi-, gloss: original-}
          - {word: puruṣaṁ, gloss: person}
          - {word: tam, gloss: Him}
          - {word: ahaṁ, gloss: I}
          - {word: bhajāmi, gloss: worship}
    translation: |-
      I worship Govinda, the primeval Lord, whose transcendental form is full of bliss, truth, substantiality and is thus full of the most dazzling splendor. Each of the limbs of that transcendental figure possesses in Himself, the full-fledged functions of all the organs, and eternally sees, maintains and manifests the infinite universes, both spiritual and mundane. [Brahma-saṁhitā Text 5.32]
    footnotes: []
