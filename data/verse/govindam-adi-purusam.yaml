          - {word: dalāyatākṣam-, gloss: petal-blooming-eyed-}
      - entries:
          - {word: barhāvataṁsam, gloss: peacock-feather-ornamented}
          - {word: asitāmbuda-, gloss: blue-cloud-}
          - {word: sundarāṅgam, gloss: beautiful-figured}
      - entries:
