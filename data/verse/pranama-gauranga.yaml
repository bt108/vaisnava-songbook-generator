title: Śrī Gaurāṅga Praṇāma
author: unknown
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: namo, gloss: I bow}
          - {word: mahā-, gloss: great-}
          - {word: vadānyāya, gloss: munificent}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: prema-, gloss: love-}
          - {word: pradāya, gloss: giver}
          - {word: te, gloss: You}
      - entries:
          - {word: kṛṣṇāya, gloss: Kṛṣṇa}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: caitanya-, gloss: Caitanya-}
          - {word: nāmne, gloss: name}
          - {word: gaura-, gloss: golden-}
          - {word: tviṣe, gloss: hue}
          - {word: namaḥ, gloss: I bow}
    translation: |-
      O most munificent incarnation! You are Kṛṣṇa Himself appearing as Śrī Kṛṣṇa Caitanya Mahāprabhu. You have assumed the golden color of Śrīmatī Rādhārāṇī, and You are widely distributing pure love of Kṛṣṇa. We offer our respectful obeisances unto You.
