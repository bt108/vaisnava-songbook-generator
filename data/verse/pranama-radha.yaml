title: Śrī Rādhā Praṇāma
author: unknown
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: tapta-, gloss: molten-}
          - {word: kāñcana-, gloss: gold-}
          - {word: gaurāṅgi, gloss: golden-limbed}
          - {word: rādhe, gloss: Rādhā}
          - {word: vṛndāvaneśvari, gloss: Vṛndāvana-queen}
      - entries:
          - {word: vṛṣabhānu-, gloss: Vṛṣabhānu-}
          - {word: sute, gloss: daughter}
          - {word: devī, gloss: goddess}
          - {word: praṇamāmi, gloss: I bow}
          - {word: hari-, gloss: Hari-}
          - {word: priye, gloss: beloved}
    translation: |-
      I offer my respects to Rādhārāṇī, whose bodily complexion is like molten gold and who is the Queen of Vṛndāvana. You are the daughter of King Vṛṣabhānu, and You are very dear to Lord Kṛṣṇa.
    footnotes: []
