title: Śrīla Prabhupāda praṇati
author: unknown
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: nama, gloss: I bow}
          - {word: oṁ, gloss: om}
          - {word: viṣṇu-, gloss: Viṣṇu-}
          - {word: pādāya, gloss: feet}
          - {word: kṛṣṇa-, gloss: Kṛṣṇa-}
          - {word: preṣṭhāya, gloss: dear}
          - {word: bhū-, gloss: earth-}
          - {word: tale, gloss: surface}
      - entries:
          - {word: śrīmate, gloss: glorious}
          - {word: bhaktivedānta-, gloss: Bhaktivedānta-}
          - {word: svāmin, gloss: Svāmī}
          - {word: īti, gloss: thus}
          - {word: nāmine, gloss: named}
    translation: |-
      I offer my respectful obeisances unto His Divine Grace A. C. Bhaktivedanta Swami Prabhupāda, who is very dear to Lord Kṛṣṇa, having taken shelter at His lotus feet.
    footnotes: []
  - number: 2
    padas:
      - entries:
          - {word: namas, gloss: I bow}
          - {word: te, gloss: you}
          - {word: sārasvate, gloss: Sarasvatī's}
          - {word: deve, gloss: divine one}
          - {word: gaura-, gloss: Gaura-}
          - {word: vāṇī-, gloss: message-}
          - {word: pracāriṇe, gloss: preacher}
      - entries:
          - {word: nirviśeṣa-, gloss: impersonalism-}
          - {word: śūnyavādi-, gloss: voidism-}
          - {word: pāścātya-, gloss: Western-}
          - {word: deśa-, gloss: countries-}
          - {word: tāriṇe, gloss: deliverer}
    translation: |-
      Our respectful obeisances are unto you, O spiritual master, servant of Sarasvatī Gosvāmī. You are kindly preaching the message of Lord Caitanyadeva and delivering the Western countries, which are filled with impersonalism and voidism.
    footnotes: []
