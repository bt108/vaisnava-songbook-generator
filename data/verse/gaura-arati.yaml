          - {word: ādi, gloss: and others}
          - {word: deva-, gloss: god-}
          - {word: gaṇe, gloss: host}
    translation: |-
      Lord Caitanya has sat down on a jeweled throne, and the demigods, headed by Lord Brahmā, perform the ārati ceremony.
