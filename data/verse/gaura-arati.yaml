          - {word: dhara, gloss: holder}
    translation: |-
      On Lord Caitanya's right side is Lord Nityānanda, and on His left is Śrī Gadādhara. Nearby stands Śrī Advaita, and Śrīvāsa Ṭhākura is holding an umbrella over Lord Caitanya's head.
