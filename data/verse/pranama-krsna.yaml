title: Śrī Kṛṣṇa Praṇāma
author: unknown
language: sk
slokas:
  - number: 1
    padas:
      - entries:
          - {word: he, gloss: O}
          - {word: kṛṣṇa, gloss: Kṛṣṇa}
          - {word: karuṇā-, gloss: mercy-}
          - {word: sindho, gloss: ocean}
          - {word: dīna-, gloss: distressed-}
          - {word: bandho, gloss: friend}
          - {word: jagat-, gloss: universe-}
          - {word: pate, gloss: lord}
      - entries:
          - {word: gopeśa, gloss: cowherd-lord}
          - {word: gopikā-, gloss: gopī-}
          - {word: kānta, gloss: lover}
          - {word: rādhā-, gloss: Rādhā-}
          - {word: kānta, gloss: lover}
          - {word: namo, gloss: I bow}
          - {word: "'stu", gloss: be}
          - {word: te, gloss: You}
    translation: |-
      O my dear Kṛṣṇa, ocean of mercy, You are the friend of the distressed and the source of creation. You are the master of the cowherdmen and the lover of the gopīs, especially Rādhārāṇī. I offer my respectful obeisances unto You.
